name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Imposter Captcha
        - Memory Camera
        - Checklist
        - Proximity Scroll Indicator
        - Isometric Keyboard
        - Dynamic Metrics Chart
        - Share Panel
        - Grab Toggle
        - Docs site
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: And what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130, Safari 18
